name: Java compile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - run: mkdir out && javac -encoding UTF-8 -d out src/jvprimolandia/*.java
      - run: printf '5\n' | java -cp out jvprimolandia.JvPrimolandia
